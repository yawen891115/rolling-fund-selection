name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies (CPU-only PyTorch)
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest tests/ -q
      - name: Smoke run on synthetic data
        run: |
          python tests/make_synthetic_data.py --out data/synthetic --n-funds 300
          python run_pipeline.py --quick --methods pca --raw-dir data/synthetic --out-dir results_synthetic
